[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "fakeperson"
version = "0.1.0"
description = "CLI for photorealistic fictional people — consistent synthetic identities"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "r3dg0d" }]
keywords = ["synthetic", "identity", "text-to-image", "privacy", "cli"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Graphics",
]
dependencies = [
  "click>=8.1",
  "pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
fakeperson = "fakeperson.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/fakeperson"]

[tool.hatch.build.targets.sdist]
include = ["src/fakeperson", "tests", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
