name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Tests
        run: pytest -q
      - name: Help smoke
        run: |
          fakeperson --help
          fakeperson generate --help
          fakeperson models list
          fakeperson generate --backend stub --count 1 --seed 1 -o /tmp/fp-out
